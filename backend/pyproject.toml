[project]
name = "qizhidacodeplatform"
version = "0.1.0"
description = "企智搭·代码平台后端服务"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0,<0.170.0",
    "uvicorn[standard]>=0.54.0,<1.0.0",
    "pydantic>=2.14.2,<3.0.0",
    "pydantic-settings>=2.16.2,<3.0.0",
    "sqlalchemy[asyncio]>=2.1.6,<2.2.0",
    "aiosqlite>=0.22.1,<1.0.0",
    "asyncpg>=0.32.0,<1.0.0",
    "alembic>=1.20.1,<2.0.0",
    "python-multipart>=0.0.32,<1.0.0",
    "httpx>=0.28.1,<1.0.0",
    "jsonschema>=4.23.0,<5.0.0",
    "cryptography>=50.0.2,<51.0.0",
    "langchain>=1.4.7,<2.0.0",
    "langchain-core>=1.7.3,<2.0.0",
    "langgraph>=1.2.19,<2.0.0",
    "langchain-openai>=1.7.3,<2.0.0",
    "langchain-anthropic>=1.7.7,<2.0.0",
    "langchain-community>=0.4.2,<1.0.0",
    "langchain-mcp-adapters>=0.3.2,<1.0.0",
    "langgraph-checkpoint-sqlite>=3.1.3,<4.0.0",
    "deepagents>=0.7.32,<0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0,<10.0.0",
    "pytest-asyncio>=1.4.1,<2.0.0",
    "ruff>=0.17.0,<1.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
