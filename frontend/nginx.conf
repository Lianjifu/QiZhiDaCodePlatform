# 前端静态资源 + /api 反代。
#
# **同域部署**：前端只认相对路径 /api（开发时是 vite 代理转的），所以生产
# 这里也转给后端就行 —— 前端代码一行都不用改，也不存在 CORS。

# Docker 内嵌 DNS（127.0.0.11）—— nginx 用它做动态解析。
#
# **为什么不用 `proxy_pass http://backend:8000`** —— 那样 nginx 只在**启动时**
# 解析一次域名，把 IP 写死。后端容器重启换 IP 之后，nginx 还指着旧 IP，
# 502 直到 nginx 自己重启。`server ... resolve` 让它按 DNS 现查。
resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend_api {
    zone backend_api 64k;
    server backend:8000 resolve;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源带指纹（文件名里有 hash），可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由：刷新 /retrospectives 这类子路由要回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # **SSE 必须关缓冲** —— 编码助手的回复是流式吐出来的。nginx 默认
        # 会攒够一块再发，开了缓冲用户看到的就是「卡半天，然后整段出现」。
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 长对话可能挂很久（审批、执行长命令），别中途掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Swagger UI / OpenAPI 文档 —— 也在同一个 server 里反代，保持单一入口
    # （后端端口不映射到宿主机，所以这是唯一能看到文档的地方）
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
